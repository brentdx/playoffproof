<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connecting Yahoo · PlayoffProof</title>
<style>
:root{--bg:#0a0b0f;--card:#12141b;--line:#242835;--ink:#e7e9f0;--ink2:#aeb4c4;--muted:#727a90;--acc:#7c5cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;text-align:center}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:18px;margin-bottom:14px}
.mark{color:var(--acc)}
h1{font-size:20px;margin:6px 0 10px;letter-spacing:-.01em}
p{color:var(--ink2);font-size:14px}
.code{margin:16px 0;background:#000;border:1px solid var(--line);border-radius:12px;padding:14px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#7cff9b;word-break:break-all}
button{background:var(--acc);color:#fff;border:0;border-radius:11px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer}
.err{color:#ff8a8a}
code{background:#000;padding:1px 5px;border-radius:5px;font-size:12px}
</style></head>
<body><div class="card">
<div class="logo"><span class="mark">▲</span>PlayoffProof</div>
<div id="ok" hidden>
<h1>Yahoo authorized ✓</h1>
<p>Copy this code and paste it back in your chat so we can finish the connection test:</p>
<div class="code" id="code"></div>
<button id="copy">Copy code</button>
</div>
<div id="no" hidden>
<h1 class="err">No code in the URL</h1>
<p>If your address bar shows <code>?code=…</code>, copy everything after <code>code=</code> and paste it back. Otherwise re-open the connect link.</p>
</div>
<script>
var c=new URLSearchParams(location.search).get('code');
if(c){document.getElementById('ok').hidden=false;document.getElementById('code').textContent=c;
document.getElementById('copy').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(c);this.textContent='Copied';};}
else{document.getElementById('no').hidden=false;}
</script>
</div></body></html>
